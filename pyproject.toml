[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "driveway-lpr"
version = "0.1.0"
description = "Nummerpladegenkendelse til indkørslen med statistik og dashboard"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fast-alpr[onnx]>=0.4,<0.5",
    "opencv-python-headless>=4.9",
    "numpy>=1.26",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pyyaml>=6.0",
    "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
driveway-lpr = "driveway_lpr.__main__:main"

[tool.setuptools.packages.find]
include = ["driveway_lpr*"]

[tool.setuptools.package-data]
driveway_lpr = ["web/templates/*.html", "web/static/*", "web/static/vendor/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
